name: enquirytrail

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadops}
      POSTGRES_DB: ${POSTGRES_DB:-leadops}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - leadops_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-leadops} -d $${POSTGRES_DB:-leadops}"]
      interval: 2s
      timeout: 3s
      retries: 15

  provider-sim:
    build: ./provider-sim
    restart: unless-stopped
    environment:
      SIM_TOKEN: ${CRM_TOKEN:-sim-token}
      SIM_HOST: "0.0.0.0"
      PORT: "8091"
    # Simulator (with local-only fault injection) is never published;
    # it is reachable only on the compose network.
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/__test__/counts')"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadops}:${POSTGRES_PASSWORD:-leadops}@db:5432/${POSTGRES_DB:-leadops}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to a private random value (see .env.example)}
      SEED_OPERATOR_USERNAME: ${SEED_OPERATOR_USERNAME:-demo-operator}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:?set SEED_OPERATOR_PASSWORD to a demo operator password in .env}
    depends_on:
      db:
        condition: service_healthy
    # Explicit migration then seed; the API never migrates on start.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    restart: "no"

  api:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadops}:${POSTGRES_PASSWORD:-leadops}@db:5432/${POSTGRES_DB:-leadops}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to a private random value (see .env.example)}
      APP_BASE_URL: http://127.0.0.1:8080
      # The browser loads the UI from the web service on port 5173 and
      # sends that exact Origin on every unsafe request. The API parses
      # ALLOWED_ORIGINS before any route runs, so the web origin must be
      # listed; an empty value here would fall back to APP_BASE_URL and
      # reject the browser. Override for any non-default deployment.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-65536}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_INTAKE_MAX: ${RATE_LIMIT_INTAKE_MAX:-600}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-300}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_REPLAY_WINDOW_SECONDS: ${WEBHOOK_REPLAY_WINDOW_SECONDS:-300}
      CRM_MODE: ${CRM_MODE:-mock}
      CRM_BASE_URL: ${CRM_BASE_URL:-http://provider-sim:8091}
      CRM_TOKEN: ${CRM_TOKEN:-sim-token}
      SLACK_MODE: ${SLACK_MODE:-disabled}
      SLACK_BASE_URL: ${SLACK_BASE_URL:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy
    ports:
      # Loopback only; no public exposure in this slice.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/live')"]
      interval: 3s
      timeout: 3s
      retries: 15

  worker:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadops}:${POSTGRES_PASSWORD:-leadops}@db:5432/${POSTGRES_DB:-leadops}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to a private random value (see .env.example)}
      CRM_MODE: ${CRM_MODE:-mock}
      CRM_BASE_URL: ${CRM_BASE_URL:-http://provider-sim:8091}
      CRM_TOKEN: ${CRM_TOKEN:-sim-token}
      SLACK_MODE: ${SLACK_MODE:-disabled}
      SLACK_BASE_URL: ${SLACK_BASE_URL:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy
    command: ["leadops-worker"]
    # The worker has no HTTP surface; its health is its heartbeat row,
    # so no compose healthcheck is faked here.

  web:
    restart: unless-stopped
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Loopback only; nginx proxies /api to the api service.
      - "127.0.0.1:5173:80"

volumes:
  leadops_db_data:
