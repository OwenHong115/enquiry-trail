name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/reliability

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://leadops:leadops@127.0.0.1:55432/leadops
      # CI-only value: the app refuses to start without a secret.
      # Never reuse this outside CI.
      SESSION_SECRET: ci-only-session-secret

    services:
      db:
        image: postgres:16
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: leadops
          POSTGRES_PASSWORD: leadops
          POSTGRES_DB: leadops
        options: >-
          --health-cmd "pg_isready -U leadops -d leadops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies from uv.lock
        working-directory: backend
        run: uv sync --locked --python 3.12

      # The API never migrates on startup; CI mirrors that.
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run unit tests
        working-directory: backend
        run: uv run pytest tests/unit -q

      - name: Run integration tests
        working-directory: backend
        run: uv run pytest tests/integration -q

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies from uv.lock
        working-directory: backend
        run: uv sync --locked --python 3.12

      - name: Run Ruff over the backend
        working-directory: backend
        run: uv run ruff check app tests

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint over the frontend
        working-directory: frontend
        run: npm run lint

  script-tests:
    # The A26 recovery script targets Windows PowerShell 5.1; its
    # harnesses fake docker/HTTP boundaries and never touch a real
    # daemon, database, or stack. This job covers exactly that
    # platform; it does not claim coverage of pwsh on Linux.
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the A26 worker-stop classification harness
        shell: powershell
        run: .\scripts\test_a26_worker_state.ps1

      - name: Run the A26 recovery flow harness
        shell: powershell
        run: .\scripts\test_a26_recovery_flow.ps1

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    env:
      # CI-only throwaway values; never reuse these outside CI.
      SESSION_SECRET: ci-only-session-secret
      SEED_OPERATOR_PASSWORD: ci-only-operator-password
      E2E_USERNAME: demo-operator
      E2E_PASSWORD: ci-only-operator-password
      E2E_BASE_URL: http://127.0.0.1:5173
      ALLOWED_ORIGINS: http://127.0.0.1:5173

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start the compose stack
        run: docker compose up -d --build

      - name: Wait for the API and web UI to become healthy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health/live >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo "Stack is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Stack did not become healthy in time."
          docker compose ps
          docker compose logs
          exit 1

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install the Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the Playwright suite
        working-directory: e2e
        run: npm run test

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs

      # Playwright config (e2e/playwright.config.ts) writes the HTML report
      # to ../playwright-report and traces/screenshots/video (retain-on-failure)
      # to ../test-results, i.e. the repository root; the e2e/ paths cover the
      # same outputs if the config is ever resolved from the e2e directory.
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the compose stack
        if: always()
        run: docker compose down -v
