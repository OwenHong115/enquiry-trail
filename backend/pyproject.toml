[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadops-backend"
version = "0.1.0"
description = "LeadOps Kit Demo 1 backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.156.8",
    "httpx>=0.28.1",
    "phonenumbers>=8.13",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2",
    "uvicorn>=0.30",
]

[project.scripts]
leadops-worker = "app.worker.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
# The sandbox locks backend/.pytest_cache to the invoking session, so cache
# writes fail with WinError 5. The cache gains nothing here (the suite runs in
# under a second), so the plugin is disabled rather than warning on every run.
addopts = "-p no:cacheprovider"
