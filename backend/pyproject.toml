[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadops-backend"
version = "0.1.0"
description = "LeadOps Kit Demo 1 backend"
requires-python = ">=3.12"
dependencies = [
    "phonenumbers>=8.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
