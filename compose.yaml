services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadops}
      POSTGRES_DB: ${POSTGRES_DB:-leadops}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - leadops_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-leadops} -d $${POSTGRES_DB:-leadops}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  leadops_db_data:
